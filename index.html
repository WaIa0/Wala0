<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Office Run</title>
  <meta name="description" content="Office Run — an endless runner through a sunlit office. Dodge chairs, copiers and filing cabinets, grab coffee, get promoted!" />
  <meta property="og:title" content="Office Run" />
  <meta property="og:description" content="Dodge office obstacles, collect coffee, climb from Intern to CEO." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/runner_spritesheet.png" />
  <meta name="theme-color" content="#1a1d26" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="icon" href="assets/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="loading">Brewing coffee&hellip;</div>
    <aside id="board" hidden>
      <h2>&#127942; Top 10 Runners</h2>
      <ol id="board-list"></ol>
      <p id="board-empty" hidden>No scores yet &mdash; set the first one!</p>
      <p id="board-offline" hidden>Leaderboard needs an internet connection.</p>
      <form id="board-form" hidden autocomplete="off">
        <label for="player-name">Your run made the office news! Enter your name:</label>
        <div class="row">
          <input id="player-name" type="text" maxlength="16" placeholder="Name" required />
          <button type="submit">Post score</button>
        </div>
      </form>
      <p id="board-thanks" hidden>Posted! Now defend your spot. &#9749;</p>
    </aside>
  </div>
  <script src="revive.js"></script>
  <script src="game.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("sw.js")
          .then((reg) => reg.update())
          .catch(() => {});
      });
      // when a new version of the game activates, reload once to show it
      let swRefreshed = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (swRefreshed) return;
        swRefreshed = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
