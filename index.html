<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Office Run</title>
  <meta name="description" content="Office Run — an endless runner through a sunlit office. Dodge chairs, copiers and filing cabinets, grab coffee, get promoted!" />
  <meta property="og:title" content="Office Run" />
  <meta property="og:description" content="Dodge office obstacles, collect coffee, climb from Intern to CEO." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/runner_spritesheet.png" />
  <meta name="theme-color" content="#1a1d26" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="icon" href="assets/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="loading">Brewing coffee&hellip;</div>
  </div>
  <script src="game.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
